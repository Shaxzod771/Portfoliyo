name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Optional repository variable (Settings → Secrets and variables → Actions → Variables):
          # the public address of the PHP backend. Empty = built-in projects + FormSubmit contact form.
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      # Publishes dist/ to the gh-pages branch.
      # GitHub → Settings → Pages → Source must be "Deploy from a branch: gh-pages / (root)".
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
